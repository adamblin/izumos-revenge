<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <!-- PLACEHOLDER room in ukiyo-e style. Replace with the final background (1280x720).
       Hotspots (buttons.yaml): desk = 180,420 320x160 · door = 860,160 220x420 -->
  <defs>
    <linearGradient id="dusk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#23436c"/>
      <stop offset="1" stop-color="#3b5677" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shoji" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9dcbd"/>
      <stop offset="1" stop-color="#f3ead4"/>
    </linearGradient>
    <pattern id="tatami" width="12" height="12" patternUnits="userSpaceOnUse">
      <rect width="12" height="12" fill="#c8b577"/>
      <path d="M0 6H12" stroke="#b09d60" stroke-width="2"/>
    </pattern>
    <pattern id="lattice" width="60" height="70" patternUnits="userSpaceOnUse">
      <rect width="60" height="70" fill="url(#shoji)"/>
      <path d="M0 0V70M0 0H60" stroke="#4a3426" stroke-width="3" fill="none"/>
    </pattern>
    <filter id="paper">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix values="0 0 0 0 0.4 0 0 0 0 0.32 0 0 0 0 0.2 0 0 0 0.12 0"/>
      <feComposite in2="SourceGraphic" operator="in"/>
    </filter>
  </defs>

  <!-- ceiling and lintel (nageshi) -->
  <rect width="1280" height="70" fill="#3a2a20"/>
  <rect y="58" width="1280" height="22" fill="#5b4030" stroke="#221c18" stroke-width="3"/>

  <!-- shoji wall -->
  <rect y="80" width="1280" height="480" fill="url(#lattice)"/>
  <rect y="80" width="1280" height="200" fill="url(#dusk)" opacity="0.55"/>
  <g stroke="#221c18" stroke-width="6">
    <line x1="0" y1="80" x2="0" y2="560"/><line x1="500" y1="80" x2="500" y2="560"/>
    <line x1="800" y1="80" x2="800" y2="560"/><line x1="1280" y1="80" x2="1280" y2="560"/>
  </g>

  <!-- tokonoma alcove with a hanging scroll -->
  <rect x="520" y="90" width="260" height="470" fill="#e2d2ae" stroke="#221c18" stroke-width="4"/>
  <rect x="520" y="520" width="260" height="40" fill="#4a3426" stroke="#221c18" stroke-width="3"/>
  <g transform="translate(600 112)">
    <rect x="-6" width="112" height="10" fill="#3a2a20"/>
    <rect y="10" width="100" height="300" fill="#b8862b" stroke="#221c18" stroke-width="2"/>
    <rect x="10" y="30" width="80" height="230" fill="#f3ead4" stroke="#221c18" stroke-width="1.5"/>
    <circle cx="66" cy="70" r="14" fill="#b8382a"/>
    <path d="M14 220 C30 190 52 182 70 196 C58 192 50 200 56 208 C66 200 80 206 86 214 V256 H14 Z" fill="#23436c" stroke="#221c18" stroke-width="1.5"/>
    <path d="M20 160 L48 110 L76 160 Z" fill="#7f93a8" stroke="#221c18" stroke-width="1.5"/>
    <rect x="-6" y="310" width="112" height="10" fill="#3a2a20"/>
  </g>
  <!-- ikebana -->
  <path d="M690 520 Q680 470 700 440 M700 520 Q720 470 745 455 M695 520 Q700 480 715 430" stroke="#4d6b4a" stroke-width="3" fill="none"/>
  <circle cx="745" cy="453" r="8" fill="#b8382a" stroke="#221c18" stroke-width="1.5"/>
  <circle cx="715" cy="428" r="6" fill="#b8382a" stroke="#221c18" stroke-width="1.5"/>
  <path d="M680 520 h40 l-6 -30 h-28 z" fill="#23436c" stroke="#221c18" stroke-width="2"/>

  <!-- tatami floor with dark borders (heri) -->
  <rect y="560" width="1280" height="160" fill="url(#tatami)"/>
  <g stroke="#2f3a2c" stroke-width="8">
    <line x1="0" y1="564" x2="1280" y2="564"/>
    <line x1="0" y1="640" x2="1280" y2="640"/>
    <line x1="420" y1="564" x2="360" y2="720"/>
    <line x1="900" y1="564" x2="960" y2="720"/>
  </g>

  <!-- low writing desk (hotspot: desk) -->
  <g stroke="#221c18" stroke-width="3" stroke-linejoin="round">
    <rect x="200" y="470" width="280" height="24" fill="#3b2418"/>
    <rect x="210" y="494" width="260" height="40" fill="#5b3424"/>
    <rect x="300" y="502" width="80" height="24" fill="#6e4330"/>
    <circle cx="340" cy="514" r="6" fill="#b8862b"/>
    <rect x="214" y="534" width="18" height="44" fill="#3b2418"/>
    <rect x="448" y="534" width="18" height="44" fill="#3b2418"/>
    <!-- inkstone and brush -->
    <rect x="232" y="452" width="60" height="18" fill="#221c18"/>
    <path d="M330 462 L430 448" stroke-width="5"/>
    <path d="M418 449.5 L436 447" stroke="#b8862b" stroke-width="7"/>
  </g>

  <!-- fusuma sliding door (hotspot: door) -->
  <g stroke="#221c18" stroke-linejoin="round">
    <rect x="866" y="166" width="208" height="402" fill="#221c18" stroke-width="3"/>
    <rect x="878" y="178" width="184" height="378" fill="#efe4cc" stroke-width="2"/>
    <!-- painted pine on the fusuma -->
    <path d="M900 540 C940 480 930 420 980 380 C1010 356 1030 330 1020 290" fill="none" stroke="#6b4530" stroke-width="9" stroke-linecap="round"/>
    <g fill="#4d6b4a" stroke-width="2">
      <ellipse cx="1010" cy="290" rx="44" ry="13"/>
      <ellipse cx="960" cy="380" rx="50" ry="14"/>
      <ellipse cx="1020" cy="440" rx="36" ry="11"/>
    </g>
    <path d="M878 228 H1062 M878 236 H1062" stroke="#b8862b" stroke-width="3"/>
    <!-- recessed handle (hikite) -->
    <circle cx="1046" cy="380" r="11" fill="#b8862b" stroke-width="2.5"/>
    <circle cx="1046" cy="380" r="5" fill="#221c18" stroke="none"/>
  </g>

  <!-- paper lantern (andon) -->
  <g stroke="#221c18" stroke-width="3">
    <rect x="1140" y="440" width="70" height="110" fill="#f6dd9a"/>
    <path d="M1140 476 H1210 M1140 512 H1210 M1175 440 V550" stroke-width="2"/>
    <rect x="1132" y="550" width="86" height="12" fill="#3b2418"/>
    <rect x="1132" y="430" width="86" height="10" fill="#3b2418"/>
  </g>

  <!-- paper grain -->
  <rect width="1280" height="720" filter="url(#paper)" fill="#fff"/>
</svg>
