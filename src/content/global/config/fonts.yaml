allowChoosingFont: true
fontSets:
  # Ukiyo-e: brush lettering for titles, classic Mincho for reading (latin subsets, OFL)
  default:
    header:
      name: Yuji Syuku
      fontFamily: '"Yuji Syuku", serif'
      files: ["fonts/Yuji_Syuku/YujiSyuku-Regular-latin.woff2"]
    body:
      name: Shippori Mincho
      fontFamily: '"Shippori Mincho", serif'
      files:
        - file: "fonts/Shippori_Mincho/ShipporiMincho-Regular-latin.woff2"
          options:
            weight: 400
        - file: "fonts/Shippori_Mincho/ShipporiMincho-Bold-latin.woff2"
          options:
            weight: 700
  classic:
    header:
      name: Baskervville SC
      fontFamily: '"Baskervville SC", serif'
      files: ["fonts/Baskervville_SC/BaskervvilleSC-Regular.ttf"]
    body:
      name: "Montserrat"
      fontFamily: '"Montserrat", sans-serif'
      files:
        - file: "fonts/Montserrat/Montserrat-VariableFont_wght.ttf"
          options: {}
        - file: "fonts/Montserrat/Montserrat-Italic-VariableFont_wght.ttf"
          options:
            style: italic
  custom:
    header:
      name: Nerko One
      fontFamily: '"Nerko One", cursive'
      files: ["fonts/Nerko_One/NerkoOne-Regular.ttf"]
    body:
      name: "Sevillana"
      fontFamily: '"Sevillana", cursive'
      files: ["fonts/Sevillana/Sevillana-Regular.ttf"]
  opendyslexic:
    header:
      name: "OpenDyslexic"
      fontFamily: '"OpenDyslexic", sans-serif'
      files:
        - file: "fonts/OpenDyslexic/OpenDyslexic-Regular.woff2"
          options:
            weight: 400
        - file: "fonts/OpenDyslexic/OpenDyslexic-Bold.woff2"
          options:
            weight: 700
        - file: "fonts/OpenDyslexic/OpenDyslexic-Italic.woff2"
          options:
            style: italic
        - file: "fonts/OpenDyslexic/OpenDyslexic-Bold-Italic.woff2"
          options:
            weight: 700
            style: italic
    body:
      name: "OpenDyslexic"
      fontFamily: '"OpenDyslexic", sans-serif'
      files:
        - file: "fonts/OpenDyslexic/OpenDyslexic-Regular.woff2"
          options:
            weight: 400
        - file: "fonts/OpenDyslexic/OpenDyslexic-Bold.woff2"
          options:
            weight: 700
        - file: "fonts/OpenDyslexic/OpenDyslexic-Italic.woff2"
          options:
            style: italic
        - file: "fonts/OpenDyslexic/OpenDyslexic-Bold-Italic.woff2"
          options:
            weight: 700
            style: italic
